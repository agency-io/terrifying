policies:
  - name: cognito-user-pool-password-policy
    description: Cognito user pools must have a strong password policy with minimum length 14 and all character requirements
    resource: terraform.aws_cognito_user_pool
    filters:
      - or:
        - type: value
          key: "password_policy.minimum_length"
          op: less-than
          value: 14
        - type: value
          key: "password_policy.require_uppercase"
          value: false
        - type: value
          key: "password_policy.require_lowercase"
          value: false
        - type: value
          key: "password_policy.require_numbers"
          value: false
        - type: value
          key: "password_policy.require_symbols"
          value: false
