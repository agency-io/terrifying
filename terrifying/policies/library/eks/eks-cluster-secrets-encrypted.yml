policies:
  - name: eks-cluster-secrets-encrypted
    description: >
      Detects EKS clusters without KMS encryption configured for Kubernetes secrets.
      Without envelope encryption, secrets are stored as base64 plaintext in etcd.
      Equivalent AWS Config rule: eks-secrets-encrypted. Maps to FSBP EKS.3 (Medium).
    resource: terraform.aws_eks_cluster
    filters:
      - type: value
        key: "encryption_config"
        value: absent
        op: eq
