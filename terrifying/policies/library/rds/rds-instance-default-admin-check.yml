policies:
  - name: rds-instance-default-admin-check
    description: >
      Detects RDS DB instances using a default administrator username (admin, root, master,
      masteruser). Equivalent to AWS Config rds-instance-default-admin-check.
      Maps to FSBP RDS.25 (Medium), NIST 800-53.
    tags:
      - security-hub
      - fsbp
      - nist-800-53
    resource: terraform.aws_db_instance
    filters:
      - type: value
        key: "username"
        op: in
        value:
          - admin
          - root
          - master
          - masteruser
