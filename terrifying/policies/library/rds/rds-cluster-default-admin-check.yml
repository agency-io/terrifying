policies:
  - name: rds-cluster-default-admin-check
    description: >
      Detects RDS DB clusters using a default administrator username (admin, root, master,
      masteruser). Equivalent to AWS Config rds-cluster-default-admin-check.
      Maps to FSBP RDS.24 (Medium), NIST 800-53.
    tags:
      - security-hub
      - fsbp
      - nist-800-53
    resource: terraform.aws_rds_cluster
    filters:
      - type: value
        key: "master_username"
        op: in
        value:
          - admin
          - root
          - master
          - masteruser
