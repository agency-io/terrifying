policies:
  - name: secretsmanager-rotation-enabled-check
    description: >
      Detects Secrets Manager secrets that do not have automatic rotation enabled.
      Equivalent to AWS Config secretsmanager-rotation-enabled-check.
      Maps to FSBP SecretsManager.1 (High), PCI DSS, nist-800-53.
    tags:
      - security-hub
      - fsbp
      - pci-dss
      - nist-800-53
    resource: terraform.aws_secretsmanager_secret_rotation
    filters: []
