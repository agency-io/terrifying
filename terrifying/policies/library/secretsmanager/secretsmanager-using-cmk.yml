policies:
  - name: secretsmanager-using-cmk
    description: >
      Detects Secrets Manager secrets not encrypted with a customer-managed KMS key (CMK).
      Non-compliant when KmsKeyId is absent or references alias/aws/secretsmanager.
      Maps to FSBP SecretsManager.5 (Medium), NIST 800-53 SC-28, PCI DSS Req 3.4.
    tags:
      - security-hub
      - fsbp
      - nist-800-53
      - pci-dss
    resource: terraform.aws_secretsmanager_secret
    filters:
      - type: value
        key: "kms_key_id"
        value: absent
