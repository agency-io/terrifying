policies:
  - name: opensearch-node-to-node-encryption-check
    description: >
      Detects OpenSearch Service domains with node_to_node_encryption disabled.
      Equivalent to AWS Config opensearch-node-to-node-encryption-check. Maps to FSBP Opensearch.3 (Medium).
    resource: terraform.aws_elasticsearch_domain
    filters:
      - node_to_node_encryption: false
