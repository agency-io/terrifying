policies:
  - name: ecs-no-environment-secrets
    description: >
      Detects ECS task definitions that pass secrets as plaintext environment
      variables. Equivalent to AWS Config ecs-no-environment-secrets.
      Maps to FSBP ECS.8 (High).
    resource: terraform.aws_ecs_task_definition
    filters:
      - type: value
        key: "container_definitions"
        value: present
        op: eq
