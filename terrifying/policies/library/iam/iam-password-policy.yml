policies:
  - name: iam-password-policy
    description: >
      Detects accounts with a weak IAM password policy (length, complexity, max age).
      Equivalent to AWS Config iam-password-policy.
      Maps to: FSBP IAM.7, IAM.15, IAM.16 (Medium), CIS 1.8-1.11.
    tags:
      - security-hub
      - fsbp
      - cis-benchmark
    resource: terraform.aws_iam_account_password_policy
    filters:
      - or:
        - type: value
          key: minimum_password_length
          value: 14
          op: lt
        - require_symbols: false
        - require_numbers: false
        - require_uppercase_characters: false
        - require_lowercase_characters: false
        - type: value
          key: max_password_age
          value: 90
          op: gt
