policies:
  - name: s3-bucket-versioning-enabled
    description: >
      Detects S3 buckets without versioning enabled or with versioning suspended.
      Equivalent to AWS Config s3-bucket-versioning-enabled.
      Maps to FSBP S3.14, CIS 2.1.3, PCI DSS, NIST 800-53.
    tags:
      - security-hub
      - fsbp
      - cis-benchmark
      - pci-dss
      - nist-800-53
    resource: terraform.aws_s3_bucket_versioning
    filters:
      - type: value
        key: "versioning_configuration[0].status"
        value: "Enabled"
        op: ne
