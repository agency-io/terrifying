policies:
  - name: s3-bucket-public-write-prohibited
    description: >
      Detects S3 buckets with public write access via ACL grants to AllUsers or
      AuthenticatedUsers. Equivalent to AWS Config s3-bucket-public-write-prohibited.
      Maps to CT Mandatory #2, FSBP S3.3, CIS 2.1.1, PCI DSS.
    tags:
      - control-tower
      - control-tower-mandatory
      - security-hub
      - fsbp
      - cis-benchmark
      - pci-dss
    resource: terraform.aws_s3_bucket
    filters:
      - type: value
        key: bucket_acl
        value: public-read-write
        op: eq
