policies:
  - name: s3-bucket-ssl-requests-only
    description: >
      Detects S3 buckets without a bucket policy that denies non-SSL requests.
      Equivalent to AWS Config s3-bucket-ssl-requests-only.
      Maps to CT Strongly Recommended #6, FSBP S3.5, CIS 2.1.2, PCI DSS.
    tags:
      - control-tower
      - control-tower-strongly-recommended
      - security-hub
      - fsbp
      - cis-benchmark
      - pci-dss
    # Check that aws:SecureTransport is enforced via bucket policy
    # This is a configuration check; c7n-left checks aws_s3_bucket_policy resources
    resource: terraform.aws_s3_bucket_policy
    filters:
      - type: value
        key: policy
        value: "SecureTransport"
        op: contains
