policies:
  - name: elbv2-predefined-security-policy-ssl-check
    description: >
      Detects ALB/NLB HTTPS or TLS listeners using outdated SSL security
      policies instead of recommended TLS 1.2+ policies. Equivalent to AWS
      Config elbv2-acm-certificate-required. Maps to FSBP ELB.17 (Medium).
    tags:
      - security-hub
      - fsbp
    resource: terraform.aws_lb_listener
    filters:
      - type: value
        key: protocol
        value:
          - HTTPS
          - TLS
        op: in
      - type: value
        key: ssl_policy
        op: not-in
        value:
          - "ELBSecurityPolicy-TLS13-1-2-2021-06"
          - "ELBSecurityPolicy-TLS13-1-2-Res-2021-06"
          - "ELBSecurityPolicy-TLS13-1-2-Ext1-2021-06"
          - "ELBSecurityPolicy-TLS13-1-2-Ext2-2021-06"
          - "ELBSecurityPolicy-TLS13-1-3-2021-06"
          - "ELBSecurityPolicy-FS-1-2-Res-2020-10"
          - "ELBSecurityPolicy-FS-1-2-Res-2019-08"
          - "ELBSecurityPolicy-FS-1-2-2019-08"
