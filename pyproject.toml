[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrifying"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-hcl2>=4.3",
]

[project.scripts]
terrifying = "terrifying.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "black>=24",
    "ruff>=0.4",
    "pylint>=3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["terrifying*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["terrifying"]

[tool.black]
target-version = ["py311"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
