[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrifying"
version = "0.1.0"
description = "Architecture testing framework for Terraform — write Python rules that verify structure, conventions, and policy."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "agency-io" }]
requires-python = ">=3.11"
keywords = ["terraform", "architecture", "testing", "linting", "infrastructure", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "python-hcl2>=4.3",
    "pyyaml>=6",
    "jinja2>=3",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]

[project.urls]
Homepage = "https://github.com/agency-io/terrifying"
Repository = "https://github.com/agency-io/terrifying"
"Bug Tracker" = "https://github.com/agency-io/terrifying/issues"

[project.scripts]
terrifying = "terrifying.cli:main"

[project.entry-points."pytest11"]
terrifying = "terrifying.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "black>=24",
    "ruff>=0.4",
    "pylint>=3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["terrifying*"]

[tool.setuptools.package-data]
"terrifying.policies.library" = ["**/*.rego", "**/*.yml", "manifest.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:terrifying"

[tool.coverage.run]
source = ["terrifying"]
branch = true
omit = ["terrifying/tui.py"]

[tool.black]
target-version = ["py311"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
